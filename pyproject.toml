[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "auto-local"
version = "0.3.0"
description = "Local tool-call decisions for coding agents. Your context stays on your computer."
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "Apache-2.0"
authors = [{name = "SSHdotCodes"}]
dependencies = [
  "torch>=2.7.1,<3", "transformers==5.16.1", "huggingface-hub>=1.0,<2",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1",
  "safetensors>=0.5,<1", "platformdirs>=4,<5", "filelock>=3.16,<4", "pyyaml>=6,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2", "psutil>=5,<8"]
# Transformers 5.16.1 accepts only kernels 0.16.x for hub attention kernels.
flash = ["kernels>=0.16,<0.17"]

[project.scripts]
auto = "auto_gate.cli:main"

[project.urls]
Homepage = "https://auto.ssh.codes"
Repository = "https://github.com/SSHDotCodes/auto"
Issues = "https://github.com/SSHDotCodes/auto/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/auto_gate"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: downloads and runs the real published model"]
