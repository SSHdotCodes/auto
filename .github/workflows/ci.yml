name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python:
    name: Python / ${{ matrix.os }} / ${{ matrix.python }} / torch ${{ matrix.torch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.13', torch: '2.13.0'}
          - {os: windows-2025, python: '3.13', torch: '2.13.0'}
          - {os: macos-15, python: '3.13', torch: '2.13.0'}
          - {os: ubuntu-24.04, python: '3.10', torch: '2.7.1'}
    env:
      AUTO_HOME: ${{ github.workspace }}/.auto-test
      PYTHONUTF8: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install CPU PyTorch on Linux and Windows
        if: runner.os != 'macOS'
        run: python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
      - name: Install unified Apple wheel
        if: runner.os == 'macOS'
        run: python -m pip install torch==${{ matrix.torch }}
      - name: Install package and development tools
        run: python -m pip install '.[dev]'
      - name: Unit tests
        run: python -m pytest -q -m 'not model'
      - name: JavaScript adapter tests
        run: node --test tests/adapters.test.mjs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .auto-test/models
          key: auto-weights-${{ runner.os }}-456e153dad2b12db14babb1dbdc8f8ece607e80a
      - name: Real published model on CPU
        run: python -m pytest -q -m model
      - name: Downloaded package, offline daemon, and all installed adapters
        run: python scripts/verify_runtime.py
      - name: PowerShell installer parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $pwd 'scripts/install.ps1'), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
  package:
    name: Lint and distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.16.6 build==1.6.0
      - run: ruff check .
      - run: ruff format --check .
      - run: sh -n scripts/install.sh
      - run: python -m build
      - name: Verify packaged adapter assets
        run: python scripts/verify_wheel.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
  website:
    name: Website / desktop and mobile
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:site
      - name: Built installers match reviewed sources
        run: diff scripts/install.py site/install.py && diff scripts/install.sh site/install.sh && diff scripts/install.ps1 site/install.ps1
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: website-test-report
          path: |
            playwright-report/
            test-results/
  agents:
    name: Real agent loader contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: npm ci --prefix tests/contracts
      - run: node tests/contracts/verify-agents.mjs
      - name: Fetch pinned Hermes source contract
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/NousResearch/hermes-agent.git .auto-test/hermes-upstream
          git -C .auto-test/hermes-upstream checkout 0e9fc2cc152b4a4d9fd736f107412ace2a0c2555
      - run: python -m pip install pyyaml platformdirs filelock
      - name: Hermes discovery, registration, and directives
        env:
          HERMES_SOURCE: ${{ github.workspace }}/.auto-test/hermes-upstream
          PYTHONPATH: src
        run: python tests/contracts/verify_hermes.py
